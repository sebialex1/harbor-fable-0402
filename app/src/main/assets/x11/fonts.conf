<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fable's fontconfig config. Installed next to the X11 client libraries and
     pointed at by FONTCONFIG_FILE, because fontconfig's compiled-in default
     (/data/data/com.termux/files/usr/etc/fonts) doesn't exist on this device.
     Scans Android's system font directories. -->
<fontconfig>
  <dir>/system/fonts</dir>
  <dir>/product/fonts</dir>
  <dir>/system_ext/fonts</dir>
  <dir>/vendor/fonts</dir>
  <dir>/odm/fonts</dir>

  <cachedir prefix="xdg">fontconfig</cachedir>

  <!-- Fallback sans-serif/serif/monospace aliases for apps that ask for them. -->
  <match target="pattern">
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Roboto</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>monospace</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Droid Sans Mono</string></edit>
  </match>

  <config></config>
</fontconfig>
