# Project-wide Gradle settings.

# JVM heap for the Gradle daemon. UTF-8 so non-ASCII strings compile the same
# on every machine.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build cache and configuration cache.
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX is required: Compose, lifecycle, navigation, and core-ktx are all
# AndroidX artifacts. checkDebugAarMetadata fails without this flag.
android.useAndroidX=true

# Each module's R class only contains its own resources.
android.nonTransitiveRClass=true

# Kotlin code style for the IDE formatter.
kotlin.code.style=official
