name: Build & Pre-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0-pre)'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
        default: 'Automated pre-release build'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # Fable's own Direct3D 11 test (container_tools/d3d11-test), bundled as an asset so every
      # container's Tools list has it. Must run before Gradle packages the assets.
      - name: Build Direct3D 11 test (MinGW-w64)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          make -C container_tools/d3d11-test
          exe=container_tools/d3d11-test/build/d3d11-test.exe
          x86_64-w64-mingw32-objdump -p "$exe" | grep 'DLL Name'
          # Statically linked: only Windows (Wine) and Direct3D DLLs, no MinGW runtime DLLs.
          if x86_64-w64-mingw32-objdump -p "$exe" | grep -qiE 'DLL Name: lib(gcc|stdc|winpthread)'; then
            echo "::error::d3d11-test.exe imports MinGW runtime DLLs"
            exit 1
          fi
          cp "$exe" app/src/main/assets/container_tools/d3d11-test.exe

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: harbor-fable-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Publish pre-release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: harbor-fable-debug-apk
          path: artifacts/

      - name: Create GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body: |
            ## Pre-release build

            ${{ github.event.inputs.notes }}

            **Artifact:** `app-debug.apk` (debug-signed, arm64-v8a)

            Built from commit ${{ github.sha }}.
          prerelease: true
          files: artifacts/*.apk
