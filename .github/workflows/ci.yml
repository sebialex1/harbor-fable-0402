name: CI

# Build-only check for every push to main and every pull request. Unlike
# build-and-release.yml (manual, publishes a pre-release), this never creates a
# tag or a release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  assemble:
    name: assembleDebug
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 ndk;27.0.12077973 cmake;3.22.1'

      - name: Assemble debug APK
        run: chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: harbor-fable-debug-apk-ci
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
